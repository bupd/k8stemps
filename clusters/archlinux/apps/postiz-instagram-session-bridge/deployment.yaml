apiVersion: apps/v1
kind: Deployment
metadata:
  name: postiz-instagram-session-bridge
  namespace: postiz
  labels:
    app.kubernetes.io/name: postiz-instagram-session-bridge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz-instagram-session-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz-instagram-session-bridge
    spec:
      imagePullSecrets:
        - name: postiz-x-cookie-bridge-ghcr
      containers:
        - name: bridge
          image: ghcr.io/bupd/postiz-instagram-session-bridge:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MEDIA_BASE_URL
              value: https://postiz.bupd.xyz/uploads/
            - name: UPLOAD_ROOT
              value: /uploads
          envFrom:
            - secretRef:
                name: postiz-instagram-session-bridge
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: uploads-volume
              mountPath: /uploads
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: postiz-uploads
        - name: tmp
          emptyDir: {}
